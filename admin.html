<!DOCTYPE html>
<html class="dark" lang="es">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>Sukidesu Sushi - Administrativo</title>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
  <link href="css/output.css" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Anybody:wght@700;800&family=Plus+Jakarta+Sans:wght@400&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet"/>
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode/1.4.4/qrcode.min.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  
  <script src="js/api.js" defer></script>
  <script src="js/ui.js" defer></script>
  <script src="js/admin.js" defer></script>
  
  <style>
    :root {
      --surface: #131313; --surface-bright: #393939; --surface-container-lowest: #0e0e0e;
      --surface-container-low: #1b1b1b; --surface-container: #1f1f1f; --surface-container-high: #2a2a2a;
      --surface-container-highest: #353535; --primary: #ffb3ac; --primary-container: #b71f22;
      --secondary: #ffb3b1; --tertiary: #d1c4b9; --error: #ffb4ab; --sushi-white: #FFFFFF;
      --wasabi-green: #ACC677;
    }
    
    .bg-surface { background-color: var(--surface) !important; }
    .bg-surface-container { background-color: var(--surface-container) !important; }
    .bg-surface-container-low { background-color: var(--surface-container-low) !important; }
    .bg-surface-container-high { background-color: var(--surface-container-high) !important; }
    .bg-primary-container { background-color: var(--primary-container) !important; }
    .text-primary { color: var(--primary) !important; }
    .text-secondary { color: var(--secondary) !important; }
    .text-tertiary { color: var(--tertiary) !important; }
    .text-sushi-white { color: var(--sushi-white) !important; }

    body { background-color: var(--surface); color: #e2e2e2; }
    
    .menu-card-img-wrapper { position: relative; overflow: hidden; width: 100%; aspect-ratio: 4/5; }
    @media (min-width: 640px) { .menu-card-img-wrapper { width: 40%; aspect-ratio: auto; min-height: 260px; } }
    .menu-card-img-wrapper img { transition: transform 0.3s ease; }
    
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: var(--surface-container); }
    ::-webkit-scrollbar-thumb { background: var(--surface-bright); border-radius: 9999px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--primary); }
    .scroll-container { cursor: grab; user-select: none; }
    .scroll-container:active { cursor: grabbing; }
  </style>
</head>
<body class="flex h-screen overflow-hidden font-body-md text-body-md relative">
  
  <nav class="hidden md:flex h-screen w-64 fixed left-0 top-0 bg-surface-container border-r border-primary/20 shadow-md flex-col p-4 z-40">
    <div class="mb-6 px-4 py-4 text-center border-b border-primary/20">
      <div class="w-24 h-24 mx-auto mb-3 rounded-full overflow-hidden border-2 border-primary">
        <div class="flex-1 flex justify-center items-center"><img class="object-contain" src="images/screen.png" alt="Logo"/></div>
      </div>
      <h1 class="font-headline-lg text-lg text-primary tracking-tighter uppercase mb-0.5">Gestión de Menú</h1>
    </div>
    <div class="flex-1 space-y-2 px-2 overflow-y-auto">
      <a class="flex items-center px-4 py-3 text-primary bg-primary/10 hover:bg-primary/20 rounded-lg border border-primary/30 mb-2" href="index.html" target="_blank">
        <span class="material-symbols-outlined mr-3 text-primary pointer-events-none">storefront</span><span class="font-label-bold pointer-events-none">Ver Carta (Cliente)</span>
      </a>
      <button id="nav-promo-btn" class="w-full flex items-center px-4 py-3 text-tertiary bg-surface-container-highest hover:bg-surface-bright rounded-lg border border-primary/30 text-left group">
        <span class="material-symbols-outlined mr-3 text-secondary group-hover:text-primary pointer-events-none">campaign</span><span class="font-label-bold pointer-events-none">Banner Promo</span>
      </button>
      <button id="nav-qr-btn" class="w-full flex items-center px-4 py-3 text-tertiary bg-surface-container-highest hover:bg-surface-bright rounded-lg border border-primary/30 text-left group">
        <span class="material-symbols-outlined mr-3 text-secondary group-hover:text-primary pointer-events-none">qr_code_2</span><span class="font-label-bold pointer-events-none">Generar QR Mesa</span>
      </button>
    </div>
    <div class="px-2 py-4 mt-auto border-t border-primary/20 space-y-3">
      <button id="nav-add-btn" class="w-full bg-primary-container text-sushi-white font-label-bold text-sm py-3 rounded-lg hover:opacity-90 flex items-center justify-center">
        <span class="material-symbols-outlined mr-2 text-base pointer-events-none">add</span> Nuevo Plato
      </button>
      <button id="nav-cat-btn" class="w-full bg-surface-container-highest text-tertiary font-label-bold text-sm py-2.5 rounded-lg border border-primary/40 hover:bg-surface-bright flex items-center justify-center">
        <span class="material-symbols-outlined mr-2 text-base pointer-events-none">folder_managed</span> Gestionar Categorías
      </button>
    </div>
  </nav>

  <main class="flex-1 ml-0 md:ml-64 h-full flex flex-col relative overflow-hidden bg-transparent">
    <div class="md:hidden flex justify-between items-center px-5 py-4 bg-surface-container border-b border-primary/20 z-30">
      <h1 class="font-headline-lg-mobile text-primary uppercase">Gestor de Menú</h1>
      <div class="flex gap-2">
        <button id="mobile-promo-btn" class="p-1.5 text-secondary border border-primary/40 rounded-md hover:bg-surface-container-highest"><span class="material-symbols-outlined text-sm pointer-events-none">campaign</span></button>
        <button id="mobile-qr-btn" class="p-1.5 text-secondary border border-primary/40 rounded-md hover:bg-surface-container-highest"><span class="material-symbols-outlined text-sm pointer-events-none">qr_code_2</span></button>
        <button id="mobile-new-btn" class="p-1.5 text-secondary border border-primary/40 rounded-md hover:bg-surface-container-highest"><span class="material-symbols-outlined text-sm pointer-events-none">add</span></button>
      </div>
    </div>

    <header class="px-5 md:px-12 py-8 flex flex-col md:flex-row justify-between items-start md:items-center gap-6 z-10 shrink-0">
      <div>
        <h2 class="font-headline-lg-mobile text-primary uppercase">Administra tus Productos</h2>
        <p class="font-body-lg text-secondary">Ver, editar y organizar tus ofertas culinarias.</p>
      </div>
      <div class="flex items-center gap-4 w-full md:w-auto">
        <div class="relative w-full sm:w-72">
          <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-primary">search</span>
          <input id="admin-search-input" class="w-full bg-surface-container border border-primary/50 rounded-lg pl-10 pr-4 py-2 text-white focus:border-primary text-sm font-body-md" placeholder="Buscar por nombre..." type="text"/>
        </div>
      </div>
    </header>

    <div class="flex-1 overflow-y-auto px-5 md:px-12 pb-12 z-10">
      <div id="admin-category-bar" class="scroll-container flex gap-3 mb-8 overflow-x-auto pb-3 -mx-5 px-5 md:mx-0 md:px-0 flex-nowrap"></div>
      <div id="admin-loading" class="text-center py-12"><span class="material-symbols-outlined text-primary text-4xl animate-spin">progress_activity</span></div>
      <div id="admin-grid" class="grid grid-cols-1 lg:grid-cols-2 gap-4 md:gap-6 hidden"></div>
    </div>
  </main>

  <!-- Modal Plato: Restaurado al diseño compacto ("Fútbol 5") -->
  <div id="itemModal" class="fixed inset-0 hidden items-center justify-center p-4 bg-black/80 backdrop-blur-md z-50">
    <div class="w-full max-w-3xl bg-surface-container-low rounded-xl shadow-2xl border border-primary/50 flex flex-col max-h-[95vh] overflow-hidden">
      
      <div class="px-4 py-3 border-b border-primary/30 flex justify-between items-center bg-surface shrink-0">
        <h3 id="modal-title" class="font-headline-lg-mobile text-lg text-primary">Añadir Nuevo Plato</h3>
        <button id="close-item-btn" class="text-secondary hover:text-primary"><span class="material-symbols-outlined pointer-events-none">close</span></button>
      </div>
      
      <form id="itemForm" class="flex flex-col flex-1 overflow-hidden">
        <input type="hidden" id="item-id" />
        
        <div class="p-4 overflow-y-auto flex-1">
          <div class="grid grid-cols-1 lg:grid-cols-[1.5fr_1fr] gap-5 items-start h-full">
            
            <div class="flex flex-col gap-3">
              <div class="grid grid-cols-[1fr_2fr] gap-3">
                <div class="flex flex-col gap-1">
                  <label class="text-[10px] font-label-bold text-primary uppercase ml-1">Categoría</label>
                  <select id="item-categoria" class="w-full bg-surface-container-high border border-primary/50 rounded-lg px-3 py-1.5 text-sushi-white focus:border-primary text-sm"></select>
                </div>
                <div class="flex flex-col gap-1">
                  <label class="text-[10px] font-label-bold text-primary uppercase ml-1">Nombre del Plato</label>
                  <input id="item-nombre" required class="w-full bg-surface-container-high border border-primary/50 rounded-lg px-3 py-1.5 text-sushi-white focus:border-primary text-sm" type="text"/>
                </div>
              </div>
              
              <div class="flex items-start gap-3">
                <div class="flex flex-col gap-1 w-28 shrink-0">
                  <label class="text-[10px] font-label-bold text-primary uppercase ml-1">Precio</label>
                  <input id="item-precio" required class="w-full bg-surface-container-high border border-primary/50 rounded-lg px-3 py-1.5 text-sushi-white focus:border-primary text-sm" type="number"/>
                </div>
                <div class="flex flex-col gap-1 flex-1">
                  <label class="text-[10px] font-label-bold text-primary uppercase ml-1">Descripción</label>
                  <textarea id="item-descripcion" rows="2" maxlength="300" class="w-full bg-surface-container-high border border-primary/50 rounded-lg px-3 py-1.5 text-sushi-white focus:border-primary resize-y text-sm min-h-[44px]"></textarea>
                </div>
              </div>
              
              <div class="flex items-center gap-4 py-1">
                <label class="flex items-center gap-2 cursor-pointer">
                  <input id="item-picante" type="checkbox" class="h-3.5 w-3.5 bg-surface-container-high rounded border-primary/50 text-primary"/>
                  <span class="text-xs text-secondary">Es Picante</span>
                </label>
                <label class="flex items-center gap-2 cursor-pointer">
                  <input id="item-pausado" type="checkbox" class="h-3.5 w-3.5 bg-surface-container-high rounded border-primary/50 text-error"/>
                  <span class="text-xs text-secondary">Pausar Plato</span>
                </label>
              </div>

              <div class="flex flex-col gap-1">
                <label class="text-[10px] font-label-bold text-primary uppercase ml-1">Enlace de Imagen</label>
                <input id="item-link-drive" type="text" class="w-full bg-surface-container-high border border-primary/50 rounded-lg px-3 py-1.5 text-sm text-sushi-white focus:border-primary"/>
                <input type="hidden" id="item-imagen-url" />
              </div>
              
              <div class="pt-3 border-t border-primary/30 flex flex-col gap-2">
                <div class="flex flex-col gap-1">
                  <label class="text-[10px] font-label-bold text-wasabi-green uppercase ml-1">Etiqueta Promo</label>
                  <input id="item-texto-promo" type="text" class="w-full bg-surface-container-high border border-primary/50 rounded-lg px-3 py-1.5 text-sm text-sushi-white" />
                </div>
                <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px;" class="text-[11px]">
                  <label class="flex items-center justify-center gap-1.5 cursor-pointer bg-surface p-1.5 rounded border border-primary/40 hover:bg-surface-bright"><input type="checkbox" name="promo-dia" value="Domingo" class="h-3 w-3 bg-surface-container rounded border-primary/50"/>Domingo</label>
                  <label class="flex items-center justify-center gap-1.5 cursor-pointer bg-surface p-1.5 rounded border border-primary/40 hover:bg-surface-bright"><input type="checkbox" name="promo-dia" value="Lunes" class="h-3 w-3 bg-surface-container rounded border-primary/50"/>Lunes</label>
                  <label class="flex items-center justify-center gap-1.5 cursor-pointer bg-surface p-1.5 rounded border border-primary/40 hover:bg-surface-bright"><input type="checkbox" name="promo-dia" value="Martes" class="h-3 w-3 bg-surface-container rounded border-primary/50"/>Martes</label>
                  <label class="flex items-center justify-center gap-1.5 cursor-pointer bg-surface p-1.5 rounded border border-primary/40 hover:bg-surface-bright"><input type="checkbox" name="promo-dia" value="Miércoles" class="h-3 w-3 bg-surface-container rounded border-primary/50"/>Miérc.</label>
                  <label class="flex items-center justify-center gap-1.5 cursor-pointer bg-surface p-1.5 rounded border border-primary/40 hover:bg-surface-bright"><input type="checkbox" name="promo-dia" value="Jueves" class="h-3 w-3 bg-surface-container rounded border-primary/50"/>Jueves</label>
                  <label class="flex items-center justify-center gap-1.5 cursor-pointer bg-surface p-1.5 rounded border border-primary/40 hover:bg-surface-bright"><input type="checkbox" name="promo-dia" value="Viernes" class="h-3 w-3 bg-surface-container rounded border-primary/50"/>Viernes</label>
                  <label style="grid-column: span 3;" class="flex items-center justify-center gap-1.5 cursor-pointer bg-surface p-1.5 rounded border border-primary/40 hover:bg-surface-bright"><input type="checkbox" name="promo-dia" value="Sábado" class="h-3 w-3 bg-surface-container rounded border-primary/50"/>Sábado</label>
                </div>
              </div>
            </div>

            <!-- Vista Previa Exacta con 12% extra (235px) y centrada globalmente en su columna -->
            <div class="flex items-center justify-center w-full h-full">
              <div class="bg-surface rounded-lg border border-primary/40 overflow-hidden flex flex-col w-full max-w-[235px] shadow-lg">
                <div class="w-full relative bg-surface-container-highest flex items-center justify-center shrink-0" style="aspect-ratio: 4/5;">
                  <img id="image-preview" src="" class="absolute inset-0 w-full h-full object-cover hidden" />
                  <span id="preview-placeholder" class="text-[10px] text-secondary font-bold z-0">Sin Imagen</span>
                  <div class="absolute top-2 left-2 flex flex-col gap-2 pointer-events-none z-10">
                    <div class="bg-surface-container-high/90 px-2 py-0.5 rounded-full border border-primary/50 w-fit backdrop-blur-sm">
                      <span id="preview-cat-text" class="font-label-bold text-[9px] text-tertiary truncate block">Categoría</span>
                    </div>
                  </div>
                </div>
                <div class="p-3 w-full flex flex-col bg-surface">
                  <div class="flex items-start justify-between gap-1 mb-1">
                    <div class="flex flex-col gap-0.5 flex-1">
                      <h3 id="preview-name-text" class="text-sm text-primary font-bold leading-tight break-words">Nombre del Plato</h3>
                    </div>
                    <div class="bg-black px-1.5 py-0.5 rounded-full text-[11px] font-bold text-sushi-white shrink-0 border border-primary/30">
                      <span id="preview-price-text">$0</span>
                    </div>
                  </div>
                  <p id="preview-desc-text" class="text-[10px] text-secondary line-clamp-2 leading-tight">Descripción...</p>
                </div>
              </div>
            </div>
            
          </div>
        </div>
        
        <div class="px-4 py-3 border-t border-primary/30 bg-surface flex justify-end items-center gap-3 shrink-0">
          <button type="button" id="cancel-item-btn" class="px-5 py-1.5 rounded-lg font-label-bold text-sm border border-primary/40 text-secondary hover:text-sushi-white">Salir</button>
          <button id="submit-btn" type="submit" class="px-5 py-1.5 rounded-lg font-label-bold text-sm bg-primary-container text-sushi-white hover:opacity-90">Guardar Plato</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Modal Promo -->
  <div id="promoConfigModal" class="fixed inset-0 hidden items-center justify-center p-4 bg-black/80 backdrop-blur-md z-50">
    <div class="w-full max-w-sm bg-surface-container-low rounded-xl shadow-2xl border border-primary/50 flex flex-col max-h-[90vh] overflow-hidden">
      <div class="px-4 py-3 border-b border-primary/30 flex justify-between items-center bg-surface shrink-0">
        <h3 class="font-headline-lg-mobile text-lg text-primary"><span class="material-symbols-outlined align-middle mr-2">campaign</span> Promo</h3>
        <button id="close-promo-btn" class="text-secondary hover:text-primary"><span class="material-symbols-outlined pointer-events-none">close</span></button>
      </div>
      <div class="p-4 space-y-3 overflow-y-auto flex-1">
        <label class="flex items-center gap-2 cursor-pointer p-3 bg-primary-container/10 border border-primary/30 rounded-lg">
          <input id="config-promo-activa" type="checkbox" class="h-4 w-4 bg-surface-container-high text-primary rounded border-primary/50"/>
          <span class="font-label-bold text-sushi-white text-xs uppercase">Activar Anuncio</span>
        </label>
        <div class="flex flex-col gap-1">
          <label class="text-[10px] text-primary font-bold">Texto</label>
          <textarea id="config-promo-texto" rows="3" class="w-full bg-surface-container-high border border-primary/50 rounded-lg px-3 py-1.5 text-sushi-white text-sm focus:border-primary resize-none"></textarea>
        </div>
        <div class="flex flex-col gap-1">
          <label class="text-[10px] text-primary font-bold">Imagen (URL)</label>
          <input id="config-promo-img" type="text" class="w-full bg-surface-container-high border border-primary/50 rounded-lg px-3 py-1.5 text-secondary text-sm focus:border-primary"/>
        </div>
      </div>
      <div class="px-4 py-3 border-t border-primary/30 bg-surface flex justify-end gap-2 shrink-0">
        <button type="button" onclick="document.getElementById('promoConfigModal').classList.replace('flex','hidden')" class="px-4 py-1.5 rounded-lg font-label-bold text-xs border border-primary/40 text-secondary">Salir</button>
        <button id="promo-save-btn" class="px-4 py-1.5 bg-primary-container text-sushi-white font-label-bold text-xs rounded-lg">Guardar</button>
      </div>
    </div>
  </div>

  <!-- Modal QR -->
  <div id="qrModal" class="fixed inset-0 hidden items-center justify-center p-4 bg-black/80 backdrop-blur-md z-50">
    <div class="w-full max-w-sm bg-surface-container-low rounded-xl shadow-2xl border border-primary/50 flex flex-col max-h-[90vh] overflow-hidden">
      <div class="px-4 py-3 border-b border-primary/30 flex justify-between items-center bg-surface shrink-0">
        <h3 class="font-headline-lg-mobile text-lg text-primary"><span class="material-symbols-outlined align-middle mr-2">qr_code_2</span> Generador QR</h3>
        <button id="close-qr-btn" class="text-secondary hover:text-primary"><span class="material-symbols-outlined pointer-events-none">close</span></button>
      </div>
      <div class="p-4 space-y-3 overflow-y-auto flex-1">
        <div class="flex flex-col gap-1">
          <label class="text-[10px] text-primary font-bold uppercase">URL del Menú</label>
          <input id="qr-input-url" type="text" class="w-full bg-surface-container-high border border-primary/50 rounded-lg px-3 py-1.5 text-sushi-white text-sm" value="https://pietroflorian-collab.github.io/menu_sukidesu/"/>
        </div>
        <div class="flex flex-col gap-1">
          <label class="text-[10px] text-primary font-bold uppercase">Logo Central</label>
          <input id="qr-input-file" type="file" accept="image/*" class="w-full bg-surface-container-high border border-primary/50 rounded-lg px-2 py-1 text-secondary text-xs file:mr-2 file:py-1 file:px-2 file:rounded file:border-0 file:bg-primary-container file:text-white"/>
        </div>
        <div class="flex justify-center bg-surface p-2 rounded-lg border border-primary/30">
          <canvas id="admin-qr-canvas" style="max-height: 180px; width: auto; object-fit: contain;" class="rounded-md"></canvas>
        </div>
      </div>
      <div class="px-4 py-3 border-t border-primary/30 bg-surface flex justify-end gap-2 shrink-0">
        <button type="button" onclick="document.getElementById('qrModal').classList.replace('flex','hidden')" class="px-4 py-1.5 rounded-lg font-label-bold text-xs border border-primary/40 text-secondary">Salir</button>
        <button id="qr-download-btn" class="px-4 py-1.5 bg-primary-container text-sushi-white font-label-bold text-xs rounded-lg flex items-center gap-1"><span class="material-symbols-outlined text-sm">download</span> Guardar</button>
      </div>
    </div>
  </div>

  <!-- Modal Categorías -->
  <div id="categoryModal" class="fixed inset-0 hidden items-center justify-center p-4 bg-black/80 backdrop-blur-md z-50">
    <div class="w-full max-w-sm bg-surface-container-low rounded-xl shadow-2xl border border-primary/50 flex flex-col max-h-[90vh] overflow-hidden">
      <div class="px-4 py-3 border-b border-primary/30 flex justify-between items-center bg-surface shrink-0">
        <h3 class="font-headline-lg-mobile text-lg text-primary">Categorías</h3>
        <button id="close-cat-btn" class="text-secondary hover:text-primary"><span class="material-symbols-outlined pointer-events-none">close</span></button>
      </div>
      <div class="p-4 overflow-y-auto space-y-4 flex-1">
        <form id="catForm" class="flex gap-2">
          <input id="new-cat-name" type="text" required class="flex-1 bg-surface-container-high border border-primary/50 rounded-lg px-3 py-1.5 text-sm text-sushi-white" placeholder="Nueva..."/>
          <button type="submit" id="add-cat-btn" class="bg-primary-container text-sushi-white px-3 py-1.5 rounded-lg font-label-bold text-xs">+ Crear</button>
        </form>
        <div id="category-manage-list" class="space-y-2 text-sm"></div>
      </div>
      <div class="px-4 py-3 border-t border-primary/30 bg-surface flex justify-end shrink-0">
        <button type="button" onclick="document.getElementById('categoryModal').classList.replace('flex','hidden')" class="px-4 py-1.5 rounded-lg font-label-bold text-xs border border-primary/40 text-secondary">Salir</button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/eruda"></script>
  <script>eruda.init();</script>
</body>
</html>
